    <script>
        // Init Icons
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) lucide.createIcons();

        // Global Helpers
        window.copyUrl = function () {
            const url = window.location.href;
            const textArea = document.createElement("textarea");
            textArea.value = url;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand("copy");
            document.body.removeChild(textArea);
            alert('URL이 복사되었습니다!');
        };

        // CDN Error Handling
        window.addEventListener('error', (e) => {
            const fallback = document.getElementById('loading-fallback');
            if (fallback && !fallback.classList.contains('hidden')) {
                fallback.innerHTML = `
                    <div class="text-rose-500 font-bold text-lg mb-2">⚠️ 리소스 로딩 오류</div>
                    <div class="text-sm text-slate-600">네트워크 연결을 확인하거나 광고 차단 기능을 끄고 새로고침 해주세요.</div>

                `;
            }
        });

        // Timeout check
        setTimeout(() => {
            const root = document.getElementById('root');
            if (root && root.classList.contains('hidden')) {
                document.getElementById('loading-fallback').innerHTML = `
                    <div class="text-amber-500 font-bold text-lg mb-2">⏳ 로딩 지연</div>
                    <div class="text-sm text-slate-600">서버 응답이 늦어지고 있습니다. 잠시만 기다려주세요.</div>
                    <button onclick="window.location.reload()" class="mt-4 px-4 py-2 bg-slate-800 text-white rounded-lg text-sm hover:bg-slate-700 transition-colors">새로고침</button>
                `;
            }
        }, 5000);
    </script>

    <script type="text/babel" data-type="module">
        import React, { useState, useMemo, useEffect, useCallback, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import {
            LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, Area, AreaChart
        } from 'recharts';
        import {
            BrainCircuit, Share2, Info, Calculator, Clock, HelpCircle, Search, RotateCcw, TrendingUp, Sparkles, PiggyBank, BookOpen
        } from 'lucide-react';

        // Reveal Root on Load
        document.getElementById('loading-fallback').classList.add('hidden');
        document.getElementById('root').classList.remove('hidden');

        // ==========================================
        // Error Boundary
        // ==========================================
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false };
            }
            static getDerivedStateFromError(error) { return { hasError: true }; }
            componentDidCatch(error, errorInfo) { console.error("Uncaught error:", error, errorInfo); }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="p-6 text-center">
                            <h2 className="text-xl font-bold text-rose-600 mb-2">계산 중 오류가 발생했습니다.</h2>
                            <button onClick={() => { localStorage.clear(); window.location.reload(); }} className="px-4 py-2 bg-slate-800 text-white rounded-lg">초기화 및 새로고침</button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        // ==========================================
        // AdBanner Component (Kakao AdFit)
        // ==========================================
        // --- AdBanner Component (Content Only) ---

        const AdBanner = ({ unit, width, height, className = "" }) => {
            const adRef = useRef(null);

            useEffect(() => {
                const script = document.createElement('script');
                script.type = 'text/javascript';
                script.src = '//t1.daumcdn.net/kas/static/ba.min.js';
                script.async = true;
                script.setAttribute('charset', 'utf-8');

                if (adRef.current) {
                    adRef.current.appendChild(script);
                }
                return () => { };
            }, []);

            return (
                <div ref={adRef} className={`ad-fit-container ${className}`}>
                    <ins className="kakao_ad_area"
                        style={{ display: "none" }}
                        data-ad-unit={unit}
                        data-ad-width={width}
                        data-ad-height={height}></ins>
                </div>
            );
        };

        // ==========================================
        // 1. Helpers
        // ==========================================
        const formatMoney = (val) => {
            if (!val && val !== 0) return "0원";
            if (Math.abs(val) >= 100000000) return `${(val / 100000000).toFixed(1)}억`;
            if (Math.abs(val) >= 10000) return `${(val / 10000).toFixed(0)}만`;
            return `${val.toLocaleString()}원`;
        };
        const formatAxisY = (val) => val >= 100000000 ? `${(val / 100000000).toFixed(0)}억` : `${(val / 10000).toFixed(0)}만`;

        const useLocalStorage = (key, initialValue) => {
            const [storedValue, setStoredValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) {
                    console.error(error);
                    return initialValue;
                }
            });
            const setValue = (value) => {
                try {
                    const valueToStore = value instanceof Function ? value(storedValue) : value;
                    setStoredValue(valueToStore);
                    window.localStorage.setItem(key, JSON.stringify(valueToStore));
                } catch (error) { console.error(error); }
            };
            return [storedValue, setValue];
        };

        // ==========================================
        // 2. UI Components
        // ==========================================
        const Card = ({ children, className = "" }) => (
            <div className={`bg-white rounded-xl shadow-sm border border-slate-200 ${className}`}>{children}</div>
        );

        const SectionHeader = ({ icon: Icon, title, subtitle }) => (
            <div className="mb-4 pb-3 border-b border-slate-100">
                <div className="flex items-center gap-2 mb-1">
                    <div className="p-1.5 rounded-lg bg-slate-100 text-slate-700"><Icon size={18} strokeWidth={2} /></div>
                    <h2 className="font-bold text-base text-slate-800">{title}</h2>
                </div>
                {subtitle && <p className="text-xs text-slate-400 pl-9">{subtitle}</p>}
            </div>
        );

        const SliderInput = ({ label, value, onChange, unit, min, max, step }) => {
            const displayValue = unit === '만원'
                ? `${value.toLocaleString()} 만원`
                : unit === '년' ? `${value} 년` : `${value} %`;

            return (
                <div className="mb-5 relative">
                    <div className="flex justify-between items-center mb-2">
                        <label className="text-xs font-bold text-slate-600">{label}</label>
                        <span className="text-xs font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded">
                            {displayValue}
                        </span>
                    </div>

                    <div className="relative flex items-center gap-3">
                        <input
                            type="range"
                            min={min}
                            max={max}
                            step={step}
                            value={value}
                            onChange={(e) => onChange(Number(e.target.value))}
                            className="flex-1 h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer"
                            style={{
                                background: `linear-gradient(to right, #3b82f6 0%, #3b82f6 ${(value - min) / (max - min) * 100}%, #e2e8f0 ${(value - min) / (max - min) * 100}%, #e2e8f0 100%)`
                            }}
                        />
                        <div className="relative w-28 shrink-0">
                            <input
                                type="number"
                                value={value}
                                onChange={(e) => onChange(Number(e.target.value))}
                                className="w-full px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-right text-xs font-bold focus:outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-500 transition-all"
                            />
                            <span className="absolute right-3 top-1/2 -translate-y-1/2 text-[10px] text-slate-400 pointer-events-none">{unit}</span>
                        </div>
                    </div>
                </div>
            );
        };

        // ==========================================
        // 3. Compound Calculator Logic
        // ==========================================
        const CompoundCalculator = () => {
            const [initAsset, setInitAsset] = useLocalStorage('cc_initAsset_v2', 1000);
            const [monthlyAdd, setMonthlyAdd] = useLocalStorage('cc_monthlyAdd_v2', 100);
            const [rate, setRate] = useLocalStorage('cc_rate', 5.0);
            const [years, setYears] = useLocalStorage('cc_years', 20);

            const calculation = useMemo(() => {
                const data = [];
                const initAssetWon = initAsset * 10000;
                const monthlyAddWon = monthlyAdd * 10000;

                let currentCompound = Number(initAssetWon);
                let currentPrincipal = Number(initAssetWon);
                let accumulatedSimpleInterest = 0;
                const monthlyRate = Number(rate) / 100 / 12;

                data.push({ year: 0, compoundTotal: Math.round(currentCompound), simpleTotal: Math.round(currentPrincipal), principal: Math.round(currentPrincipal) });

                for (let i = 1; i <= years; i++) {
                    for (let m = 0; m < 12; m++) {
                        currentCompound = (currentCompound + Number(monthlyAddWon)) * (1 + monthlyRate);
                        accumulatedSimpleInterest += (currentPrincipal + Number(monthlyAddWon)) * monthlyRate;
                        currentPrincipal += Number(monthlyAddWon);
                    }
                    data.push({
                        year: i,
                        compoundTotal: Math.round(currentCompound),
                        simpleTotal: Math.round(currentPrincipal + accumulatedSimpleInterest),
                        principal: Math.round(currentPrincipal)
                    });
                }

                const final = data[data.length - 1];
                const finalPrincipal = final.principal;
                const finalCompound = final.compoundTotal;
                const finalSimple = final.simpleTotal;

                const profitCompound = finalCompound - finalPrincipal;
                const profitSimple = finalSimple - finalPrincipal;
                const diff = profitCompound - profitSimple;
                const simpleYield = finalPrincipal > 0 ? (profitSimple / finalPrincipal) * 100 : 0;
                const compoundYield = finalPrincipal > 0 ? (profitCompound / finalPrincipal) * 100 : 0;

                return { data, finalPrincipal, finalCompound, profitSimple, profitCompound, diff, simpleYield, compoundYield };
            }, [initAsset, monthlyAdd, rate, years]);

            const clearStorage = () => {
                if (confirm('입력된 정보를 초기화하시겠습니까?')) {
                    setInitAsset(1000);
                    setMonthlyAdd(100);
                    setRate(5.0);
                    setYears(20);
                }
            }

            return (
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 animate-in fade-in duration-500">
                    {/* ========== INPUT PANEL ========== */}
                    <section className="input-panel lg:col-span-4 space-y-4">
                        <div className="input-group p-4">
                            <SectionHeader icon={Calculator} title="투자 설정" subtitle="복리의 마법을 설정하세요" />

                            <div className="space-y-6">
                                <SliderInput label="초기 투자 금액" value={initAsset} onChange={setInitAsset} unit="만원" min={0} max={100000} step={100} />
                                <SliderInput label="매월 추가 투자액" value={monthlyAdd} onChange={setMonthlyAdd} unit="만원" min={0} max={5000} step={10} />
                                <SliderInput label="연 수익률 (%)" value={rate} onChange={setRate} unit="%" min={0} max={30} step={0.1} />
                                <SliderInput label="투자 기간 (년)" value={years} onChange={setYears} unit="년" min={1} max={50} step={1} />
                            </div>

                            <div className="mt-8 pt-6 border-t border-slate-100 text-center">
                                <button onClick={clearStorage} className="text-xs text-slate-400 underline hover:text-slate-600 flex items-center justify-center gap-1 mx-auto transition-colors">
                                    <RotateCcw size={12} /> 데이터 초기화
                                </button>
                            </div>
                        </div>
                    </section>

                    {/* ========== OUTPUT PANEL ========== */}
                    <section className="output-panel lg:col-span-8 space-y-4">
                        {/* ========== RESULT DASHBOARD ========== */}
                        <div className="result-dashboard bg-slate-900 rounded-xl overflow-hidden shadow-lg border border-slate-800">
                            <div className="flex flex-col md:flex-row items-stretch">
                                <div className="flex-1 p-6 flex flex-col justify-center relative overflow-hidden">
                                    <div className="absolute right-0 top-0 w-64 h-64 bg-emerald-500 rounded-full blur-[100px] opacity-10 -mr-16 -mt-16 pointer-events-none"></div>

                                    <div className="relative z-10">
                                        <div className="flex items-center gap-2 mb-2 text-emerald-400">
                                            <Sparkles size={18} />
                                            <span className="text-xs font-bold uppercase tracking-wider">복리의 마법</span>
                                        </div>
                                        <div className="text-4xl font-black text-white mb-2 tracking-tight">
                                            {formatMoney(calculation.finalCompound)}
                                        </div>
                                        <div className="flex items-center gap-2 text-sm">
                                            <span className="text-slate-400">총 투자 수익</span>
                                            <span className="text-emerald-400 font-bold">+{formatMoney(calculation.profitCompound)}</span>
                                            <span className="px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 text-xs font-bold">+{calculation.compoundYield.toFixed(0)}%</span>
                                        </div>
                                    </div>
                                </div>

                                <div className="flex-none w-full md:w-72 bg-slate-800/50 border-t md:border-t-0 md:border-l border-slate-700/50 p-5 flex flex-col justify-center gap-4">
                                    <div className="flex justify-between items-center">
                                        <span className="text-xs text-slate-400 font-bold">투자 원금</span>
                                        <span className="text-sm font-bold text-white">{formatMoney(calculation.finalPrincipal)}</span>
                                    </div>
                                    <div className="flex justify-between items-center">
                                        <span className="text-xs text-slate-400 font-bold">단리 수익</span>
                                        <div className="text-right">
                                            <div className="text-sm font-bold text-blue-300">+{formatMoney(calculation.profitSimple)}</div>
                                            <div className="text-[10px] text-slate-500">{calculation.simpleYield.toFixed(0)}% 수익률</div>
                                        </div>
                                    </div>
                                    <div className="pt-3 border-t border-slate-700/50 flex justify-between items-center">
                                        <span className="text-xs text-orange-300 font-bold flex items-center gap-1"><TrendingUp size={12} /> 복리 효과</span>
                                        <span className="text-sm font-bold text-orange-400">+{formatMoney(calculation.diff)} 더 이득</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Ad: Body Horizontal (Above Chart) */}

                        <AdBanner unit="DAN-w2OqK8PQgbYOk5CA" width="320" height="50" className="flex justify-center my-4" />

                        <Card className="p-5">
                            <div className="mb-4">
                                <h3 className="font-bold text-sm text-slate-800 flex items-center gap-2">
                                    <TrendingUp className="text-blue-600" size={18} /> 단리 vs 복리 자산 성장 비교
                                </h3>
                            </div>
                            <div className="h-[320px] w-full">
                                <ResponsiveContainer width="100%" height="100%">
                                    <AreaChart data={calculation.data} margin={{ top: 10, right: 10, left: 0, bottom: 0 }}>
                                        <defs>
                                            <linearGradient id="colorCompound" x1="0" y1="0" x2="0" y2="1">
                                                <stop offset="5%" stopColor="#f59e0b" stopOpacity={0.3} />
                                                <stop offset="95%" stopColor="#f59e0b" stopOpacity={0} />
                                            </linearGradient>
                                            <linearGradient id="colorSimple" x1="0" y1="0" x2="0" y2="1">
                                                <stop offset="5%" stopColor="#3b82f6" stopOpacity={0.3} />
                                                <stop offset="95%" stopColor="#3b82f6" stopOpacity={0} />
                                            </linearGradient>
                                        </defs>
                                        <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                        <XAxis dataKey="year" fontSize={11} tickLine={false} axisLine={false} tick={{ fill: '#94a3b8' }} />
                                        <YAxis tickFormatter={formatAxisY} width={45} fontSize={11} tickLine={false} axisLine={false} tick={{ fill: '#94a3b8' }} />
                                        <Tooltip
                                            formatter={(v) => formatMoney(v)}
                                            contentStyle={{ borderRadius: '8px', border: 'none', boxShadow: '0 4px 12px rgba(0,0,0,0.1)', fontSize: '12px' }}
                                        />
                                        <Legend iconType="circle" wrapperStyle={{ paddingTop: '10px', fontSize: '12px' }} />
                                        <Area type="monotone" dataKey="simpleTotal" name="단리 (원금+단리이자)" stroke="#3b82f6" strokeWidth={2} fill="url(#colorSimple)" strokeDasharray="5 5" />
                                        <Area type="monotone" dataKey="compoundTotal" name="복리 (투자수익포함)" stroke="#f59e0b" strokeWidth={2} fill="url(#colorCompound)" />
                                    </AreaChart>
                                </ResponsiveContainer>
                            </div>
