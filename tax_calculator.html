        import { PieChart, Pie, Cell, LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer } from 'recharts';

        // --- AdBanner Component (Content Only) ---
        const AdBanner = ({ unit, width, height, className = "" }) => {

        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false }; }
            static getDerivedStateFromError(error) { return { hasError: true }; }
            render() {
                if (this.state.hasError) return <div class="p-6 text-center"><h2 class="text-xl font-bold text-rose-600">오류 발생</h2><button onclick="location.reload()" class="mt-2 px-4 py-2 bg-slate-800 text-white rounded">새로고침</button></div>;
                return this.props.children;
            }
        }

        const formatMoney = (val) => {
            if (!val && val !== 0) return "0원";
            if (Math.abs(val) >= 100000000) return `${(val / 100000000).toFixed(1)}억`;
            if (Math.abs(val) >= 10000) return `${(val / 10000).toFixed(0)}만`;
            return `${val.toLocaleString()}원`;
        };
        const formatMoneyDetail = (val) => `${Math.round(val / 10000).toLocaleString()}만`;
        const formatAxisY = (val) => val >= 100000000 ? `${(val / 100000000).toFixed(0)}억` : `${(val / 10000).toFixed(0)}만`;

        const useLocalStorage = (key, initialValue) => {
            const [storedValue, setStoredValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) { return initialValue; }
            });
            const setValue = (value) => {
                try {
                    setStoredValue(value);
                    window.localStorage.setItem(key, JSON.stringify(value));
                } catch (error) { }
            };
            return [storedValue, setValue];
        };

        const Card = ({ children, className = "" }) => <div className={`bg-white rounded-xl shadow-sm border border-slate-200 ${className}`}>{children}</div>;

        const SectionHeader = ({ icon: Icon, title, subtitle }) => (
            <div className="mb-4 pb-3 border-b border-slate-100">

                </div>
                {subtitle && <p className="text-xs text-slate-400 pl-9">{subtitle}</p>}
            </div>
        );

        const SliderInput = ({ label, value, onChange, unit, min, max, step, tooltip, color = "blue" }) => {
            const displayValue = unit === '만원' ? `${value.toLocaleString()} 만원` : unit === '년' ? `${value} 년` : `${value} %`;
            const colorClass = color === "emerald" ? "bg-emerald-50 text-emerald-600" : color === "indigo" ? "bg-indigo-50 text-indigo-600" : "bg-blue-50 text-blue-600";

            return (
                <div className="mb-5 relative group">
                    <div className="flex justify-between items-center mb-2">
                        <label className="text-xs font-bold text-slate-600 flex items-center gap-1 cursor-help">
                            {label}
                            {tooltip && <Info size={12} className="text-slate-400" />}
                        </label>
                        <span className={`text-xs font-bold px-2 py-0.5 rounded ${colorClass}`}>{displayValue}</span>
                    </div>
                    {tooltip && (
                        <div className="absolute z-50 bottom-full left-0 mb-1 w-64 p-3 bg-slate-800 text-white text-[11px] rounded-lg opacity-0 group-hover:opacity-100 invisible group-hover:visible transition-all pointer-events-none border border-slate-700 shadow-xl leading-relaxed z-[999]">
                            {tooltip}
                            <div className="absolute top-full left-2 -mt-1 border-4 border-transparent border-t-slate-800"></div>
                        </div>
                    )}
                    <div className="relative flex items-center gap-3">
                        <input type="range" min={min} max={max} step={step} value={value} onChange={(e) => onChange(Number(e.target.value))} className="flex-1 h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer"
                            style={{ background: `linear-gradient(to right, #94a3b8 0%, #94a3b8 ${(value - min) / (max - min) * 100}%, #e2e8f0 ${(value - min) / (max - min) * 100}%, #e2e8f0 100%)` }} />
                        <div className="relative w-24 shrink-0">
                            <input type="number" value={value} onChange={(e) => onChange(Number(e.target.value))} className="w-full px-2 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-right text-xs font-bold focus:outline-none focus:ring-2 focus:ring-blue-100" />
                            <span className="absolute right-2 top-1/2 -translate-y-1/2 text-[10px] text-slate-400 pointer-events-none">{unit}</span>
                        </div>
                    </div>
                </div>
            );
        };

        const TaxCalculator = () => {
            const [totalPrincipal, setTotalPrincipal] = useLocalStorage('tc_opt_principal_v8', 5000);
            const [totalMonthly, setTotalMonthly] = useLocalStorage('tc_opt_monthly_v8', 200);
            const [years, setYears] = useLocalStorage('tc_opt_years_v8', 20);

            const [rateGain, setRateGain] = useLocalStorage('tc_opt_rate_gain_v8', 8.0);
            const [rateDiv, setRateDiv] = useLocalStorage('tc_opt_rate_div_v8', 3.0);

            const [salary, setSalary] = useLocalStorage('tc_opt_salary_v8', 8000);
            const [otherFin, setOtherFin] = useLocalStorage('tc_opt_other_fin_v8', 0);

            const result = useMemo(() => {
                const r_total = (rateGain + rateDiv) / 100;

                const getGlobalTaxRate = (base) => {
                    if (base <= 14000000) return 0.066;
                    if (base <= 50000000) return 0.165;
                    if (base <= 88000000) return 0.264;
                    if (base <= 150000000) return 0.385;
                    if (base <= 300000000) return 0.418;
                    if (base <= 500000000) return 0.440;
                    if (base <= 1000000000) return 0.462;
                    return 0.495;
                };

                let accounts = {
                    isa: { name: 'ISA (중개형)', principal: 0, balance: 0, color: '#10b981' },
                    pension: { name: '연금저축/IRP', principal: 0, balance: 0, color: '#f59e0b' },
                    direct: { name: '해외직투 (일반)', principal: 0, balance: 0, color: '#3b82f6' }
                };

                let generalScenario = { balance: 0, principal: 0, taxPaid: 0 };

                // ISA Limits (Man-won)
                const ISA_ANNUAL_CAP = 2000;
                const ISA_TOTAL_CAP = 10000;
                let isa_total_contrib = 0;

                // Simulation Init
                let p_current = totalPrincipal;

                // ISA Alloc (Year 1)
                let isa_room_total = ISA_TOTAL_CAP - isa_total_contrib;
                let isa_room_annual = ISA_ANNUAL_CAP;
                let isa_possible = Math.min(isa_room_total, isa_room_annual);
                let to_isa = Math.min(p_current, isa_possible);

                p_current -= to_isa;
                accounts.isa.principal += to_isa;
                accounts.isa.balance += to_isa * 10000;
                isa_total_contrib += to_isa;

                // Pension Alloc (Year 1)
                let to_pension = Math.min(p_current, 1800);
                p_current -= to_pension;
                accounts.pension.principal += to_pension;
                accounts.pension.balance += to_pension * 10000;

                // Direct Alloc (Rest)
                let to_direct = p_current;
                accounts.direct.principal += to_direct;
                accounts.direct.balance += to_direct * 10000;

                // General Scenario Init
                generalScenario.principal += totalPrincipal;
                generalScenario.balance += totalPrincipal * 10000;

                const simData = [];

                for (let y = 1; y <= years; y++) {
                    const monthlyYearlyTotal = totalMonthly * 12;
                    let flow = monthlyYearlyTotal;

                    // 1. Contributions (Smart Flow)
                    // ISA check limits
                    let isa_room_total = ISA_TOTAL_CAP - isa_total_contrib;
                    let isa_room_annual = ISA_ANNUAL_CAP; // Reset annual limit
                    let isa_possible = Math.min(isa_room_total, isa_room_annual);

                    let add_isa = Math.min(flow, isa_possible);
                    if (add_isa > 0) {
                        accounts.isa.principal += add_isa;
                        accounts.isa.balance += add_isa * 10000;
                        isa_total_contrib += add_isa;
                        flow -= add_isa;
                    }

                    let pen_room = 1800;
                    let add_pen = Math.min(flow, pen_room);
                    if (add_pen > 0) {
                        accounts.pension.principal += add_pen;
                        accounts.pension.balance += add_pen * 10000;
                        flow -= add_pen;
                    }

                    if (flow > 0) {
                        accounts.direct.principal += flow;
                        accounts.direct.balance += flow * 10000;
                    }

                    generalScenario.principal += monthlyYearlyTotal;
                    generalScenario.balance += monthlyYearlyTotal * 10000;

                    // 2. Growth & Annual Tax
                    const isaGain = accounts.isa.balance * (rateGain / 100);
                    const isaDiv = accounts.isa.balance * (rateDiv / 100);
                    accounts.isa.balance += isaGain + isaDiv;

                    const penGain = accounts.pension.balance * (rateGain / 100);
                    const penDiv = accounts.pension.balance * (rateDiv / 100);
                    accounts.pension.balance += penGain + penDiv;

                    // Direct Tax
                    const dirGain = accounts.direct.balance * (rateGain / 100);
                    const dirDiv = accounts.direct.balance * (rateDiv / 100);
                    let dirTax = 0;
                    const dirFinIncome = dirDiv + (otherFin * 10000);
                    if (dirFinIncome > 20000000) {
                        const excess = dirFinIncome - 20000000;
                        const marginal = getGlobalTaxRate((salary * 10000) + excess);
                        const taxTotal = (20000000 * 0.154) + (excess * marginal);
                        const nhis = excess * 0.0709;
                        dirTax = (taxTotal * (dirDiv / dirFinIncome)) + (nhis * (dirDiv / dirFinIncome));
                    } else {
                        dirTax = dirDiv * 0.154;
                    }
                    accounts.direct.balance += dirGain + dirDiv - dirTax;

                    // General Tax
                    const genGain = generalScenario.balance * (rateGain / 100);
                    const genDiv = generalScenario.balance * (rateDiv / 100);
                    const genTotalIncome = genGain + genDiv;
                    let genTax = 0;
                    const genFinIncome = genTotalIncome + (otherFin * 10000);
                    if (genFinIncome > 20000000) {
                        const excess = genFinIncome - 20000000;
                        const marginal = getGlobalTaxRate((salary * 10000) + excess);
                        const taxTotal = (20000000 * 0.154) + (excess * marginal);
                        const nhis = excess * 0.0709;
                        genTax = (taxTotal * (genTotalIncome / genFinIncome)) + (nhis * (genTotalIncome / genFinIncome));
                    } else {
                        genTax = genTotalIncome * 0.154;
                    }
                    generalScenario.balance += genGain + genDiv - genTax;
                    generalScenario.taxPaid += genTax;

                    simData.push({
                        name: `${y}년`,
                        optimized: (accounts.isa.balance + accounts.pension.balance + accounts.direct.balance),
                        general: generalScenario.balance
                    });
                }

                // 3. Final Liquidation
                const isaProfit = accounts.isa.balance - (accounts.isa.principal * 10000);
                const isaTaxable = Math.max(0, isaProfit - 2000000);
                const isaExitTax = isaTaxable * 0.099;
                const isaNet = accounts.isa.balance - isaExitTax;

                const penExitTax = accounts.pension.balance * 0.055;
                const penNet = accounts.pension.balance - penExitTax;

                const dirGainTotal = accounts.direct.balance - (accounts.direct.principal * 10000);
                const dirCapitalGain = dirGainTotal * (rateGain / (rateGain + rateDiv));
                const dirTaxable = Math.max(0, dirCapitalGain - 2500000);
                const dirExitTax = dirTaxable * 0.22;
                const dirNet = accounts.direct.balance - dirExitTax;

                const genNet = generalScenario.balance;

                const optimizedNet = isaNet + penNet + dirNet;
                const taxSaved = optimizedNet - genNet;

                // Pie Data in Won units for Tooltip
                const pieData = [
                    { name: 'ISA 계좌', value: accounts.isa.principal * 10000, color: '#10b981' },
                    { name: '연금저축', value: accounts.pension.principal * 10000, color: '#f59e0b' },
                    { name: '해외직투', value: accounts.direct.principal * 10000, color: '#3b82f6' },
                ].filter(d => d.value > 0);

                return {
                    simData, pieData,
                    optimizedNet, genNet, taxSaved,
                    accounts: { isa: isaNet, pension: penNet, direct: dirNet },
                    generalAcc: { taxTotal: generalScenario.taxPaid, net: genNet },
                    benefit: taxSaved,
                    isaFull: isa_total_contrib >= ISA_TOTAL_CAP
                };
            }, [totalPrincipal, totalMonthly, years, rateGain, rateDiv, salary, otherFin]);

            const resetData = () => {
                setTotalPrincipal(5000); setTotalMonthly(200); setYears(20);
                setRateGain(8.0); setRateDiv(3.0);
                setSalary(8000); setOtherFin(0);
            };

            return (
