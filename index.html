    <script>

    <script type="text/babel" data-type="module">
        import React, { useState, useMemo, useEffect, useCallback, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import {
            AreaChart, Area, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, ReferenceLine,
            ComposedChart, BarChart, Bar, Line, LineChart, PieChart, Pie, Cell
        } from 'recharts';
        import {
            Activity, AlertTriangle, Briefcase, BrainCircuit, Wallet, Home, Target,
            Landmark, BadgeAlert, Coins, ArrowUpRight, Sparkles, TrendingUp, PiggyBank,
            Clock, Calculator, Share2, Info, ChevronUp, ChevronDown, CheckSquare, Square, RefreshCw, Check, ArrowRightCircle,
            Leaf, Search, HelpCircle, Zap, Coffee, Percent, Scissors, BookOpen, UserPlus, Globe, TrendingDown,
            Dice5, RotateCcw
        } from 'lucide-react';

        // Reveal Root on Load moved to Component Main Logic

        // ==========================================
        // AdBanner Component (Kakao AdFit)
        // ==========================================
        // --- AdBanner Component (Content Only) ---
        const AdBanner = ({ unit, width, height, className = "" }) => {
            const adRef = useRef(null);

            useEffect(() => {
                const script = document.createElement('script');
                script.type = 'text/javascript';
                script.src = '//t1.daumcdn.net/kas/static/ba.min.js';
                script.async = true;
                script.setAttribute('charset', 'utf-8');

                if (adRef.current) {
                    adRef.current.appendChild(script);
                }
                return () => { };
            }, []);

            return (
                <div ref={adRef} className={`ad-fit-container overflow-hidden ${className}`} style={{ height: `${height}px` }}>

                        style={{ display: "none" }}
                        data-ad-unit={unit}
                        data-ad-width={width}
                        data-ad-height={height}></ins>
                </div>
            );
        };


        // ==========================================
        // 0. IMPROVED: Error Boundary
        // ==========================================
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false };
            }
            static getDerivedStateFromError(error) { return { hasError: true }; }
            componentDidCatch(error, errorInfo) { console.error("Uncaught error:", error, errorInfo); }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="p-6 text-center">
                            <h2 className="text-xl font-bold text-rose-600 mb-2">계산 중 오류가 발생했습니다.</h2>
                            <button onClick={() => { localStorage.clear(); window.location.reload(); }} className="px-4 py-2 bg-slate-800 text-white rounded-lg">초기화 및 새로고침</button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        // ==========================================
        // 1. Constants & Helper Functions
        // ==========================================
        const CONST_LIFE_EXPECTANCY = 85;
        const NPS_MAX_PENSION = 2660000;
        const NPS_A_VALUE = 2997200; // 2024년 기준 A값 (전체 가입자 평균소득)
        const U01inf = 2.5;
        const PENSION_ACCESS_AGE = 55;

        const RETURN_RATES = { savings: 2.0, stock: 8.0, pension: 3.5, other: 3.0 };
        const PIE_COLORS = ['#3b82f6', '#8b5cf6', '#10b981', '#f59e0b'];

        // Helper: NaN/Negative Safety
        const safeNumber = (val) => {
            if (typeof val !== 'number' || isNaN(val)) return 0;
            return val;
        };

        const formatMoney = (val) => {
            if (!val && val !== 0) return "0원";
            if (Math.abs(val) >= 100000000) return `${(val / 100000000).toFixed(1)}억`;
            if (Math.abs(val) >= 10000) return `${(val / 10000).toFixed(0)}만`;
            return `${val.toLocaleString()}원`;
        };
        const formatAxisY = (val) => val >= 100000000 ? `${(val / 100000000).toFixed(0)}억` : `${(val / 10000).toFixed(0)}만`;

        // IMPROVED: LocalStorage Hook
        const useLocalStorage = (key, initialValue) => {
            const [storedValue, setStoredValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) {
                    console.error(error);
                    return initialValue;
                }
            });
            const setValue = (value) => {
                try {
                    const valueToStore = value instanceof Function ? value(storedValue) : value;
                    setStoredValue(valueToStore);
                    window.localStorage.setItem(key, JSON.stringify(valueToStore));
                } catch (error) { console.error(error); }
            };
            return [storedValue, setValue];
        };

        // IMPROVED: Box-Muller for Normal Distribution (Randomness)
        const boxMullerRandom = () => {
            let u = 0, v = 0;
            while (u === 0) u = Math.random();
            while (v === 0) v = Math.random();
            return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
        };

        // 5% Unit Ranking System (Existing logic)
        const getRankMessage = (score) => {
            if (score >= 100) return { emoji: "🏰", label: "완벽한 은퇴", status: "충분", msg: "축하합니다! 숨만 쉬어도 생활비가 나옵니다." };
            if (score >= 80) return { emoji: "😐", label: "평균 이상", status: "안정", msg: "나쁘지 않지만, 오래 살면 위험합니다." };
            if (score >= 60) return { emoji: "😟", label: "불안정", status: "경고", msg: "지금 소비를 줄이지 않으면 나중에 강제로 줄여야 합니다." };
            if (score >= 40) return { emoji: "🚑", label: "응급 환자", status: "심각", msg: "지금 당장 재무 상담이 필요합니다." };
            return { emoji: "☠️", label: "생존 위기", status: "소멸", msg: "지금 당장 지출을 0으로 만드세요." };
        };


        // ==========================================
        // 2. UI Components
        // ==========================================
        const Card = ({ children, className = "" }) => (
            <div className={`bg-white rounded-xl shadow-sm border border-slate-200 ${className}`}>{children}</div>
        );

        const SectionHeader = ({ icon: Icon, title }) => (
            <div className="mb-3 pb-2 border-b border-slate-100 flex items-center gap-2">
                <div className="p-1.5 rounded-lg bg-slate-100 text-slate-700"><Icon size={16} strokeWidth={2} /></div>
                <h2 className="font-bold text-sm text-slate-800">{title}</h2>
            </div>
        );

        const InputGroup = ({ label, value, onChange, unit, tooltip, max, step = 1, type = "number", disabled = false, readOnlyValue = null }) => (
            <div className="mb-3 relative group">
                <div className="flex justify-between items-center mb-1">
                    <label className="text-xs font-semibold text-slate-600 flex items-center gap-1 cursor-help">
                        {label}
                        {tooltip && (
                            <div className="relative inline-block" role="tooltip">
                                <Info size={12} className="text-slate-400 hover:text-blue-500 transition-colors" />
                                <div className="absolute z-[9999] bottom-full left-0 mb-2 w-64 p-3 bg-slate-800 text-white text-xs rounded-lg opacity-0 group-hover:opacity-100 invisible group-hover:visible pointer-events-none transition-all duration-200 shadow-xl border border-slate-700 whitespace-normal break-keep">
                                    {tooltip}
                                    <div className="absolute top-full left-1.5 -mt-1 border-4 border-transparent border-t-slate-800"></div>
                                </div>
                            </div>
                        )}
                    </label>
                    {!disabled && <span className="text-[10px] font-bold px-1.5 py-0.5 rounded-md text-blue-600 bg-blue-50">
                        {unit === '원' && value >= 10000 ? formatMoney(value) : `${Number(value).toLocaleString()}${unit}`}
                    </span>}
                </div>
                <div className="relative">
                    <input
                        type={type}
                        value={disabled && readOnlyValue !== null ? readOnlyValue : (value === 0 ? '' : value)}
                        onChange={(e) => {
                            const val = parseFloat(e.target.value);
                            if (!disabled && !isNaN(val) && val >= 0) {
                                onChange(val);
                            } else if (e.target.value === '') {
                                onChange(0);
                            }
                        }}
                        disabled={disabled}
                        placeholder="0"
                        className={`w-full pl-3 pr-8 py-2 bg-slate-50 border rounded-lg outline-none font-mono text-sm font-bold text-right transition-all ${disabled ? 'bg-slate-100 text-slate-500 cursor-not-allowed' : 'focus:border-blue-500 focus:ring-2 focus:ring-blue-100 hover:bg-white text-slate-700'}`}
                        step={step} min="0"
                    />
                    <span className="absolute right-3 top-1/2 -translate-y-1/2 text-[11px] font-medium text-slate-400 pointer-events-none">{unit}</span>
                </div>
                {max && !disabled && (
                    <input type="range" min="0" max={max} value={value} step={step} onChange={(e) => onChange(Number(e.target.value))} className="w-full h-1 rounded-lg appearance-none cursor-pointer mt-2 bg-slate-200 accent-blue-600" aria-label={label} />
                )}
            </div>
        );

        const CustomChartTooltip = ({ active, payload, label }) => {
            if (active && payload && payload.length) {
                const data = payload[0].payload;
                const totalIncome = data.nps * 12 + data.housing * 12 + data.pension * 12 + data.general * 12;
                const monthlyIncome = Math.round(totalIncome / 12);
                const monthlyExpense = data.expense;
                const monthlyShortfall = Math.max(0, monthlyExpense - monthlyIncome);

                return (
                    <div className="bg-white/95 p-3 rounded-xl border border-slate-200 shadow-xl text-xs backdrop-blur-sm z-50">
                        <div className="font-bold text-slate-800 mb-2 border-b border-slate-100 pb-1">{label}세 시점 (월 기준)</div>
                        <div className="space-y-1.5">
                            <div className="flex justify-between gap-4">
                                <span className="text-slate-500">필요 생활비</span>
                                <span className="font-bold text-slate-700">{formatMoney(monthlyExpense)}</span>
                            </div>
                            <div className="flex justify-between gap-4">
                                <span className="text-slate-500">수령 생활비</span>
                                <span className="font-bold text-blue-600">{formatMoney(monthlyIncome)}</span>
                            </div>
                            {/* Breakdown */}
                            <div className="pl-2 border-l-2 border-slate-100 space-y-1 mt-1">
                                <div className="flex justify-between gap-4 text-[10px]">
                                    <span className="text-slate-400">• 국민연금</span>
                                    <span className="font-medium text-slate-600">{formatMoney(data.nps)}</span>
                                </div>
                                {data.housing > 0 && (
                                    <div className="flex justify-between gap-4 text-[10px]">
                                        <span className="text-slate-400">• 주택연금</span>
                                        <span className="font-medium text-slate-600">{formatMoney(data.housing)}</span>
                                    </div>
                                )}
                                <div className="flex justify-between gap-4 text-[10px]">
                                    <span className="text-slate-400">• 개인연금</span>
                                    <span className="font-medium text-slate-600">{formatMoney(data.pension)}</span>
                                </div>
                                <div className="flex justify-between gap-4 text-[10px]">
                                    <span className="text-slate-400">• 기타 자산</span>
                                    <span className="font-medium text-slate-600">{formatMoney(data.general)}</span>
                                </div>
                            </div>
                            <div className="border-t border-slate-100 pt-1 mt-1 flex justify-between gap-4">
                                <span className="text-slate-500 font-bold">부족한 생활비</span>
                                <span className={`font-bold ${monthlyShortfall > 0 ? 'text-rose-500' : 'text-emerald-500'}`}>
                                    {monthlyShortfall > 0 ? `-${formatMoney(monthlyShortfall)}` : '0원'}
                                </span>
                            </div>
                        </div>
                    </div>
                );
            }
            return null;
        };

        // ==========================================
        // 3. Main Calculator
        // ==========================================
        const RetirementCalculator = () => {
            // IMPROVED: Use LocalStorage for Persistence
            const [ageNow, setAgeNow] = useLocalStorage('rc_ageNow', 35);
            const [ageRetire, setAgeRetire] = useLocalStorage('rc_ageRetire', 55);
            const [targetMonthly, setTargetMonthly] = useLocalStorage('rc_targetMonthly', 5000000);

            // Handle Loading Fallback
            useEffect(() => {
                const fallback = document.getElementById('loading-fallback');
                const root = document.getElementById('root');
                if (fallback) fallback.classList.add('hidden');
                if (root) root.classList.remove('hidden');
            }, []);

            const [workYears, setWorkYears] = useLocalStorage('rc_workYears', 5); // 기존 근속년수
            const [monthlyPay, setMonthlyPay] = useLocalStorage('rc_monthlyPay', 3000000);

            const [assetSavings, setAssetSavings] = useLocalStorage('rc_assetSavings', 5000000);
            const [assetStock, setAssetStock] = useLocalStorage('rc_assetStock', 5000000);
            const [assetPension, setAssetPension] = useLocalStorage('rc_assetPension', 5000000);
            const [assetOther, setAssetOther] = useLocalStorage('rc_assetOther', 5000000);
            const [monthlyInvest, setMonthlyInvest] = useLocalStorage('rc_monthlyInvest', 1500000);

            const [severancePay, setSeverancePay] = useState(0); // Calculated, no persist needed

            const [housePrice, setHousePrice] = useLocalStorage('rc_housePrice', 0);
            const [houseLoan, setHouseLoan] = useLocalStorage('rc_houseLoan', 0);
            const [downsizing, setDownsizing] = useLocalStorage('rc_downsizing', false);
            const [downsizingAmt, setDownsizingAmt] = useLocalStorage('rc_downsizingAmt', 100000000);

            const [strategy, setStrategy] = useLocalStorage('rc_strategy', 50);
            const [withdrawalStrategy, setWithdrawalStrategy] = useLocalStorage('rc_withdrawalStrategy', 'uniform');
            const [isMonteCarlo, setIsMonteCarlo] = useState(false); // Toggle for Randomness

            // Small Tips
            const [activeTips, setActiveTips] = useState(new Set());
            const toggleTip = (id) => {
                const newTips = new Set(activeTips);
                if (newTips.has(id)) newTips.delete(id);
                else newTips.add(id);
                setActiveTips(newTips);
            };

            const solutions = [
                { id: 'work_more', title: '은퇴 3년 늦추기', desc: '근로/퇴직금/연금↑', detail: '은퇴를 3년 늦춰 자산 인출을 늦추고, 퇴직금과 연금 납입액을 늘립니다.', icon: Briefcase, color: 'text-blue-600 bg-blue-50' },
                { id: 'nps_plus', title: '국민연금 임의가입', desc: '은퇴 후 월9만 납입', detail: '은퇴 후 65세까지 월 9만원을 추가 납입하여 연금 수령액을 늘립니다.', icon: Landmark, color: 'text-sky-600 bg-sky-50' },
                { id: 'house_pension', title: '주택연금 가입', desc: '55세부터 월지급', detail: '보유 주택을 담보로 55세부터 평생 월 지급금을 받습니다. (가입 연령별 차등 지급률 적용)', icon: Home, color: 'text-teal-600 bg-teal-50' },
                { id: 'isa_account', title: '절세계좌 활용', desc: '세액공제 수익률↑', detail: 'ISA/IRP 비과세 및 분리과세 혜택으로 실질 투자 수익률을 0.5% 높입니다.', icon: Percent, color: 'text-purple-600 bg-purple-50' },
            ];

            // FIXED: Severance Pay Calculation Logic
            useEffect(() => {
                const isWorkMore = activeTips.has('work_more');
                const yearsToRetire = Math.max(0, ageRetire - ageNow);
                const additionalYears = yearsToRetire + (isWorkMore ? 3 : 0);
                const totalServiceYears = workYears + additionalYears;

                // Future Salary: 2% Annual Growth
                const finalMonthlyPay = monthlyPay * Math.pow(1.02, additionalYears);

                // Severance: Final Monthly Pay * Total Service Years
                const totalAccrued = finalMonthlyPay * totalServiceYears;

                setSeverancePay(Math.round(totalAccrued));
            }, [monthlyPay, workYears, ageNow, ageRetire, activeTips]);

            const activeBoosts = useMemo(() => {
                let extraInvest = 0;
                let bonusReturn = 0;
                if (activeTips.has('isa_account')) bonusReturn += 0.5;
                return { extraInvest, bonusReturn };
            }, [activeTips]);

            // --- Simulation Logic ---
            const simResult = useMemo(() => {
                if (ageNow > ageRetire) return { error: true, msg: "현재 나이가 은퇴 목표 나이보다 많습니다." };

                const isWorkMore = activeTips.has('work_more');
                const effAgeRetire = ageRetire + (isWorkMore ? 3 : 0);
                const effWorkYears = workYears + Math.max(0, effAgeRetire - ageNow); // Total Years for NPS

                const { extraInvest, bonusReturn } = activeBoosts;
                const effMonthlyInvest = monthlyInvest + extraInvest;
                const effTargetMonthly = targetMonthly; // FIXED: Variable defined

                // Allocation Weights
                const w_other = 0.10;
                const w_stock = (strategy / 100) * 0.90;
                const w_safe_remainder = 0.90 - w_stock;
                const w_savings = w_safe_remainder * 0.5;
                const w_pension = w_safe_remainder * 0.5;

                // IMPROVED: NPS Logic (A-value + B-value)
                const yearsToRetire = Math.max(0, effAgeRetire - ageNow);
                const sumPastIncome = monthlyPay * workYears;
                let sumFutureIncome = 0;
                for (let i = 1; i <= yearsToRetire; i++) {
                    sumFutureIncome += monthlyPay * Math.pow(1.02, i);
                }
                const lifetimeAvgIncome = (sumPastIncome + sumFutureIncome) / effWorkYears;

                const npsFactor = Math.min(0.4, effWorkYears * 0.01);
                let npsAmt = (NPS_A_VALUE + lifetimeAvgIncome) / 2 * npsFactor;
                npsAmt = Math.min(npsAmt, NPS_MAX_PENSION);

                if (activeTips.has('nps_plus') && effAgeRetire < 65) {
                    const extraMonths = (65 - effAgeRetire) * 12;
                    npsAmt += extraMonths * 4000;
                }
                if (isNaN(npsAmt)) npsAmt = 0;

                // IMPROVED: Housing Pension Logic
                let housingPensionAmt = 0;
                if (activeTips.has('house_pension') && housePrice > 0) {
                    const effectiveHousePrice = downsizing ? Math.max(0, housePrice - downsizingAmt) : housePrice;
                    if (effectiveHousePrice > 0) {
                        let rate = 0.0028;
                        if (effAgeRetire >= 60) rate = 0.0032;
                        else if (effAgeRetire < 55) rate = 0.0025;

                        if (effectiveHousePrice > 900000000) rate *= 0.9;
                        else if (effectiveHousePrice > 600000000) rate *= 0.95;

                        housingPensionAmt = effectiveHousePrice * rate;
                    }
                }

                // Simulation
                const data = [];
                let pool_savings = safeNumber(assetSavings);
                let pool_stock = safeNumber(assetStock);
                let pool_pension = safeNumber(assetPension);
                if (yearsToRetire === 0) pool_pension += severancePay;

                let pool_other = safeNumber(assetOther);

                if (yearsToRetire === 0 && downsizing) {
                    const gain = downsizingAmt;
                    pool_savings += gain * w_savings;
                    pool_stock += gain * w_stock;
                    pool_pension += gain * w_pension;
                    pool_other += gain * w_other;
                }

                let assetComposition = [];
                let totalShortfall = 0;
                let retiredMonths = 0;

                const rate_stock_base = RETURN_RATES.stock + bonusReturn;
                const rate_pension = RETURN_RATES.pension + bonusReturn;
                const rate_other_base = RETURN_RATES.other + bonusReturn;
                const rate_savings = RETURN_RATES.savings;

                for (let age = ageNow; age <= CONST_LIFE_EXPECTANCY; age++) {
                    const isRetired = age >= effAgeRetire;
                    const isNPSActive = age >= 65;
                    const isHousingPensionActive = activeTips.has('house_pension') && age >= 55;
                    const isPensionActive = age >= PENSION_ACCESS_AGE;
                    const yearIndex = age - ageNow;

                    const inflationFactor = Math.pow(1 + U01inf / 100, yearIndex);
                    const annualExpenseNeed = effTargetMonthly * 12 * inflationFactor;

                    let marketFactor = 0;
                    if (isMonteCarlo) {
                        marketFactor = boxMullerRandom() * 0.15;
                    } else {
                        const marketTrend = Math.sin(yearIndex * 0.5);
                        const marketNoise = Math.cos(yearIndex * 1.5) * 0.3;
                        marketFactor = (marketTrend + marketNoise) * 0.05;
                    }

                    const rate_stock_applied = rate_stock_base + (marketFactor * 100);
                    const applyGrowth = (pool, rate) => pool * (1 + rate / 100);

                    if (age === effAgeRetire) {
                        assetComposition = [
                            { name: '예적금', value: Math.round(pool_savings) },
                            { name: '주식/ETF', value: Math.round(pool_stock) },
                            { name: '연금', value: Math.round(pool_pension) },
                            { name: '기타(금)', value: Math.round(pool_other) }
                        ];
                    }

                    if (!isRetired) {
                        const annualCont = effMonthlyInvest * 12;
                        pool_savings = safeNumber(applyGrowth(pool_savings + (annualCont * w_savings), rate_savings));
                        pool_pension = safeNumber(applyGrowth(pool_pension + (annualCont * w_pension), rate_pension));
                        pool_other = pool_other * (1 + rate_other_base / 100) + (annualCont * w_other);
                        pool_stock = safeNumber(applyGrowth(pool_stock + (annualCont * w_stock), rate_stock_applied));

                        if (age === effAgeRetire - 1) {
                            pool_pension = safeNumber(pool_pension + severancePay);
                            if (downsizing) {
                                const gain = downsizingAmt;
                                pool_savings += gain * w_savings;
                                pool_stock += gain * w_stock;
                                pool_pension += gain * w_pension;
                                pool_other += gain * w_other;
                            }
                        }

                        const totalBal = Math.round(pool_savings + pool_stock + pool_other + pool_pension);
                        if (isNaN(totalBal)) break;

                        data.push({
                            age, balance: totalBal,
                            nps: 0, housing: 0, pension: 0, general: 0,
                            expense: Math.round(annualExpenseNeed / 12),
                            isRetired: false
                        });
                    } else {
                        retiredMonths += 12;
                        let income_nps = isNPSActive ? (npsAmt * 12 * inflationFactor) : 0;
                        let income_housing = isHousingPensionActive ? (housingPensionAmt * 12) : 0;

                        let deficit = Math.max(0, annualExpenseNeed - income_nps - income_housing);

                        pool_savings = safeNumber(applyGrowth(pool_savings, rate_savings));
                        pool_pension = safeNumber(applyGrowth(pool_pension, rate_pension));
                        pool_stock = safeNumber(applyGrowth(pool_stock, rate_stock_applied));
                        pool_other = pool_other * (1 + rate_other_base / 100);

                        let totalGeneral = pool_savings + pool_stock + pool_other;
                        let income_pension = 0;
                        let income_general = 0;

                        if (withdrawalStrategy === 'uniform') {
                            const remainingYears = CONST_LIFE_EXPECTANCY - age + 1;
                            if (remainingYears > 0) {
                                if (isPensionActive && pool_pension > 0) income_pension = pool_pension / remainingYears;
                                if (totalGeneral > 0) income_general = totalGeneral / remainingYears;
                            } else {
                                if (isPensionActive) income_pension = pool_pension;
                                income_general = totalGeneral;
                            }
                        } else {
                            if (deficit > 0) {
                                const usablePension = isPensionActive ? pool_pension : 0;
                                const totalLiquid = usablePension + totalGeneral;
                                if (totalLiquid > 0) {
                                    const take = Math.min(deficit, totalLiquid);
                                    if (isPensionActive && pool_pension > 0) income_pension = take * (pool_pension / totalLiquid);
                                    if (totalGeneral > 0) income_general = take * (totalGeneral / totalLiquid);
                                }
                            }
                        }

                        const totalIncome = income_nps + income_housing + income_pension + income_general;
                        const yearShortfall = Math.max(0, annualExpenseNeed - totalIncome);
                        totalShortfall += yearShortfall / inflationFactor;

                        pool_pension = Math.max(0, pool_pension - income_pension);

                        if (totalGeneral > 100) {
                            if (income_general > 0) {
                                const ratio = income_general / totalGeneral;
                                pool_savings = Math.max(0, pool_savings - (pool_savings * ratio));
                                pool_stock = Math.max(0, pool_stock - (pool_stock * ratio));
                                pool_other = Math.max(0, pool_other - (pool_other * ratio));
                            }
                        } else {
                            if (income_general > 0) {
                                pool_savings = 0; pool_stock = 0; pool_other = 0;
                            }
                        }

                        const totalBal = Math.round(pool_savings + pool_stock + pool_other + pool_pension);
                        data.push({
                            age, balance: totalBal,
                            nps: Math.round(income_nps / 12),
                            housing: Math.round(income_housing / 12),
                            pension: Math.round(income_pension / 12),
                            general: Math.round(income_general / 12),
                            expense: Math.round(annualExpenseNeed / 12),
                            isRetired: true
                        });
                    }
                }

                const avgMonthlyShortfall = retiredMonths > 0 ? Math.round(totalShortfall / (retiredMonths / 12) / 12) : 0;
                let totalAssetsAtRetire = 0;

                if (data.length > 0) {
                    const retirePoint = data.find(d => d.age === effAgeRetire);
                    totalAssetsAtRetire = retirePoint ? retirePoint.balance : 0;
                }
                if (yearsToRetire === 0 && assetComposition.length === 0) {
                    totalAssetsAtRetire = assetSavings + assetStock + assetPension + assetOther + (downsizing ? downsizingAmt : 0) + severancePay;
                    assetComposition = [
                        { name: '예적금', value: assetSavings }, { name: '주식', value: assetStock },
                        { name: '연금', value: assetPension + severancePay }, { name: '기타', value: assetOther }
                    ];
                }

                const neededLumpSum = effTargetMonthly * 12 * 25;
                const score = Math.round((totalAssetsAtRetire / neededLumpSum) * 100);
                const computedPercent = Math.max(1, Math.min(99, 100 - score + 10));
                const tier = getRankMessage(score);

                return { data, tier, score, totalAssetsAtRetire, computedPercent, error: false, effAgeRetire, assetComposition, activeBoosts, avgMonthlyShortfall };
            }, [ageNow, ageRetire, targetMonthly, workYears, monthlyPay, assetSavings, assetStock, assetPension, assetOther, monthlyInvest, houseLoan, downsizing, downsizingAmt, strategy, activeTips, severancePay, activeBoosts, housePrice, withdrawalStrategy, isMonteCarlo]);

            const clearStorage = () => {
                if (confirm('입력된 모든 정보를 초기화하시겠습니까?')) {
                    localStorage.clear();
                    window.location.reload();
                }
            }
            return (
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 animate-in fade-in duration-500">
                    {/* ========== INPUT PANEL ========== */}
                    <section className="input-panel lg:col-span-4 space-y-4">
                        {/* ========== INPUT GROUP: 은퇴 목표 ========== */}
                        <div className="input-group p-4">
                            <SectionHeader icon={Target} title="은퇴 목표" />
                            <div className="grid grid-cols-2 gap-3">
                                <InputGroup label="현재 나이" value={ageNow} onChange={setAgeNow} unit="세" max={80} />
                                <InputGroup label="은퇴 목표 나이" value={ageRetire} onChange={setAgeRetire} unit="세" max={90} />
                            </div>
                            <InputGroup label="은퇴 후 월 생활비" value={targetMonthly} onChange={setTargetMonthly} unit="원" step={100000} tooltip="은퇴 시점부터 평생 유지하고 싶은 생활비입니다 (현재 가치). 인플레이션은 자동 반영됩니다." />
                        </div>

                        <div className="input-group p-4">
                            <SectionHeader icon={Briefcase} title="소득 정보" />
                            <div className="grid grid-cols-2 gap-3">
                                <InputGroup label="총 근로 기간" value={workYears} onChange={setWorkYears} unit="년" tooltip="현재까지 근무한 총 연수입니다." />
                                <InputGroup label="월 소득(세후)" value={monthlyPay} onChange={setMonthlyPay} unit="원" step={100000} />
                            </div>
                            <div className="mt-2 pt-2 border-t border-slate-100 bg-slate-50/50 p-2 rounded-lg">
                                <InputGroup label="예상 퇴직금 (자동계산)" value={severancePay} onChange={setSeverancePay} unit="원" step={1000000} disabled={true} tooltip="현재 소득과 근속연수, 미래 임금상승률(2%)을 반영하여 자동 계산됩니다." />
                            </div>
                        </div>

                        <div className="input-group p-4">
                            <SectionHeader icon={Wallet} title="자산 정보" />
                            <div className="grid grid-cols-2 gap-3">
                                <InputGroup label="예적금" value={assetSavings} onChange={setAssetSavings} unit="원" step={1000000} />
                                <InputGroup label="주식/ETF" value={assetStock} onChange={setAssetStock} unit="원" step={1000000} />
                                <InputGroup label="개인연금/IRP" value={assetPension} onChange={setAssetPension} unit="원" step={1000000} />
                                <InputGroup label="기타자산 (금 등)" value={assetOther} onChange={setAssetOther} unit="원" step={1000000} />
                            </div>
                            <div className="my-3 border-t border-slate-100"></div>
                            <InputGroup label="은퇴 전 월 추가 저축" value={monthlyInvest} onChange={setMonthlyInvest} unit="원" step={100000} />
                        </div>

                        <div className="input-group p-4">
                            <SectionHeader icon={Home} title="부동산" />
                            <div className="grid grid-cols-2 gap-3">
                                <InputGroup label="주택 가격" value={housePrice} onChange={setHousePrice} unit="원" step={10000000} />
                                <InputGroup label="주택 대출" value={houseLoan} onChange={setHouseLoan} unit="원" step={10000000} />
                            </div>
                            <div className="mt-3 pt-3 border-t border-slate-100">
                                <label className="flex items-center gap-2 cursor-pointer group mb-2">
                                    <div className={`w-4 h-4 rounded border flex items-center justify-center transition-all ${downsizing ? 'bg-blue-600 border-blue-600 text-white' : 'border-slate-300 bg-white'}`}>
                                        {downsizing && <Check size={12} strokeWidth={3} />}
                                    </div>
                                    <input type="checkbox" className="hidden" checked={downsizing} onChange={(e) => setDownsizing(e.target.checked)} aria-label="주택 다운사이징 여부" />
                                    <div className="text-xs font-bold text-slate-700">은퇴 시 주택 다운사이징</div>
                                </label>
                                {downsizing && (
                                    <div className="animate-in fade-in slide-in-from-top-2 duration-300">
                                        <InputGroup label="예상 확보 현금" value={downsizingAmt} onChange={setDownsizingAmt} unit="원" step={10000000} />
                                    </div>
                                )}
                            </div>
                        </div>

                        <div className="text-center">
                            <button onClick={clearStorage} className="text-xs text-slate-400 underline hover:text-slate-600 flex items-center justify-center gap-1 mx-auto">
                                <RotateCcw size={12} /> 데이터 초기화
                            </button>
                        </div>
                    </section>

                    {/* ========== OUTPUT PANEL ========== */}
                    <section className="output-panel lg:col-span-8 space-y-4">
                        {simResult && !simResult.error ? (
                            <>

                                {/* ========== RESULT DASHBOARD ========== */}
                                <div className="result-dashboard">
                                    <div className="flex flex-col md:flex-row items-stretch">
                                        <div className="flex-1 p-5 flex items-center gap-4 relative">
                                            <div className="absolute right-0 top-0 w-40 h-40 bg-blue-500 rounded-full blur-[80px] opacity-20 -mr-10 -mt-10 pointer-events-none"></div>
                                            <div className="text-5xl filter drop-shadow-md z-10">{simResult.tier.emoji}</div>
                                            <div className="z-10">
                                                <div className="flex items-center gap-2 mb-1">
                                                    <h2 className="text-2xl font-black text-white tracking-tight">{simResult.tier.label}</h2>
                                                    <span className={`px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider ${simResult.score >= 80 ? 'bg-emerald-500/20 text-emerald-300' : simResult.score >= 50 ? 'bg-blue-500/20 text-blue-300' : 'bg-rose-500/20 text-rose-300'}`}>
                                                        {simResult.tier.status}
                                                    </span>
                                                </div>
                                                <div className="flex items-center gap-2 text-slate-400 text-xs font-medium">
                                                    <span>상위 <span className="text-white font-bold">{simResult.computedPercent}%</span> 수준</span>
                                                    <span className="w-1 h-1 bg-slate-600 rounded-full"></span>
                                                    <span>준비 점수 {simResult.score}점</span>
                                                </div>
                                            </div>
                                        </div>
                                        <div className="flex-none w-full md:w-64 bg-slate-800/50 border-t md:border-t-0 md:border-l border-slate-700/50 p-4 flex flex-col justify-center gap-3">
                                            <div className="flex justify-between items-center">
                                                <span className="text-[11px] text-slate-400 font-bold">은퇴 시점 자산</span>
                                                <span className="text-sm font-bold text-white">{formatMoney(simResult.totalAssetsAtRetire)}</span>
                                            </div>
                                            <div className="flex justify-between items-center">
                                                <span className="text-[11px] text-slate-400 font-bold">월 부족 생활비</span>
                                                <span className={`text-sm font-bold ${simResult.avgMonthlyShortfall > 0 ? 'text-rose-400' : 'text-emerald-400'}`}>
                                                    {simResult.avgMonthlyShortfall > 0 ? `-${formatMoney(simResult.avgMonthlyShortfall).replace('원', '')}` : '충분함'}
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="bg-slate-950/30 p-3 border-t border-slate-800/50 flex items-start gap-3">
                                        <Sparkles size={16} className="text-yellow-400 shrink-0 mt-0.5" />
                                        <p className="text-xs text-slate-300 leading-relaxed font-medium">
                                            "{simResult.tier.msg} 현재 국민연금+주택연금+개인연금 및 자산 인출을 모두 포함하여 계산되었습니다."
                                        </p>
                                    </div>
                                </div>

                                {/* AD: Content Body (Center) */}
                                <AdBanner unit="DAN-w2OqK8PQgbYOk5CA" width="320" height="50" className="flex justify-center my-4" />

                                {/* Tips */}
                                <div className="mt-2">
                                    <div className="flex items-center gap-2 mb-2">
                                        <div className="bg-slate-800 text-yellow-400 p-1 rounded-md"><Zap size={14} fill="currentColor" /></div>
                                        <h3 className="font-bold text-sm text-slate-800">자산 불리기 스몰 팁</h3>
                                    </div>
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
                                        {solutions.map((sol) => {
                                            const isSelected = activeTips.has(sol.id);
                                            return (
                                                <div key={sol.id} className="group perspective-1000 h-20 cursor-pointer" onClick={() => toggleTip(sol.id)} role="button" aria-pressed={isSelected}>
                                                    <div className={`relative w-full h-full duration-500 transform-style-3d transition-transform ${isSelected ? 'rotate-y-180' : ''}`}>
                                                        {/* Front */}
                                                        <div className={`absolute w-full h-full backface-hidden p-3 rounded-lg border shadow-sm flex flex-col justify-center gap-1 ${isSelected ? 'bg-blue-50 border-blue-400' : 'bg-white border-slate-200 group-hover:border-blue-300'}`}>
                                                            <div className="flex items-center gap-2">
                                                                <div className={`w-6 h-6 rounded-md flex items-center justify-center shrink-0 ${sol.color}`}>
                                                                    <sol.icon size={14} />
                                                                </div>
                                                                <div className={`font-bold text-xs ${isSelected ? 'text-blue-900' : 'text-slate-800'}`}>{sol.title}</div>
                                                            </div>
                                                            <div className="text-[10px] text-slate-500 pl-8 leading-tight">{sol.desc}</div>
                                                        </div>
                                                        {/* Back */}
                                                        <div className="absolute w-full h-full backface-hidden rotate-y-180 p-2 rounded-lg bg-indigo-600 text-white shadow-md flex flex-col justify-center items-center text-center border border-indigo-500">
                                                            <div className="text-[10px] leading-tight text-white break-keep">{sol.detail}</div>
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>



                                {/* Strategy & Chart */}
                                <div className="flex flex-col gap-4">
                                    <div className="p-3 bg-gradient-to-r from-white to-slate-50 border-slate-200">
                                        <div className="flex items-center justify-between mb-2">
                                            <div className="flex items-center gap-2">
                                                <Activity size={14} className="text-slate-600" />
                                                <h3 className="font-bold text-xs text-slate-700">자산 운용 전략</h3>
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <div className="relative group">
                                                    <button onClick={() => setIsMonteCarlo(!isMonteCarlo)} className={`flex items-center gap-1 text-[10px] px-2 py-0.5 rounded-full border transition-all ${isMonteCarlo ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-500 border-slate-300'}`}>
                                                        <Dice5 size={12} /> {isMonteCarlo ? '랜덤 변동성 ON' : '고정 수익률'}
                                                    </button>
                                                    <div className="absolute z-50 bottom-full right-0 mb-2 w-48 p-2 bg-slate-800 text-white text-[10px] rounded-lg opacity-0 group-hover:opacity-100 invisible group-hover:visible transition-all pointer-events-none text-center leading-tight shadow-xl">
                                                        {isMonteCarlo ? '역사적 변동성을 반영하여 매년 수익률이 무작위로 변합니다. (하락장 시뮬레이션)' : '시장 등락 없이 매년 평균 수익률만큼 일정하게 성장한다고 가정합니다.'}
                                                        <div className="absolute top-full right-4 -mt-1 border-4 border-transparent border-t-slate-800"></div>
                                                    </div>
                                                </div>
                                                <div className="ml-1">
                                                    {strategy < 33 ? <span className="text-[10px] font-bold text-white bg-blue-600 px-2.5 py-1 rounded-full">안정형</span> : strategy > 66 ? <span className="text-[10px] font-bold text-white bg-rose-600 px-2.5 py-1 rounded-full">공격형</span> : <span className="text-[10px] font-bold text-white bg-purple-600 px-2.5 py-1 rounded-full">밸런스형</span>}
                                                </div>
                                            </div>
                                        </div>
                                        <input type="range" min="0" max="100" value={strategy} onChange={(e) => setStrategy(Number(e.target.value))} className="w-full h-1.5 rounded-lg appearance-none cursor-pointer strategy-track shadow-inner mb-2" aria-label="투자 전략 비율 설정" />
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        <div className="p-4 flex flex-col md:col-span-2">
                                            <div className="mb-2 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                                                <h3 className="font-bold text-sm text-slate-800 flex items-center gap-2">
                                                    <TrendingUp className="text-blue-600" size={16} /> 자산 흐름 예측
                                                </h3>
                                                <div className="flex bg-slate-100 p-0.5 rounded-lg">
                                                    <button onClick={() => setWithdrawalStrategy('uniform')} className={`px-3 py-1 text-[10px] font-bold rounded-md transition-all ${withdrawalStrategy === 'uniform' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-400'}`}>균등 분할</button>
                                                    <button onClick={() => setWithdrawalStrategy('target')} className={`px-3 py-1 text-[10px] font-bold rounded-md transition-all ${withdrawalStrategy === 'target' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-400'}`}>목표 생활비 맞춤</button>
                                                </div>
                                            </div>
                                            <div className="h-[300px] w-full min-h-0 relative z-10">
                                                <ResponsiveContainer width="100%" height="100%">
                                                    <ComposedChart data={simResult.data} margin={{ top: 10, right: 0, bottom: 0, left: -20 }}>
                                                        <defs>
                                                            <linearGradient id="colorNps" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stopColor="#3b82f6" stopOpacity={0.8} /><stop offset="95%" stopColor="#3b82f6" stopOpacity={0.2} /></linearGradient>
                                                            <linearGradient id="colorHousing" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stopColor="#f97316" stopOpacity={0.8} /><stop offset="95%" stopColor="#f97316" stopOpacity={0.2} /></linearGradient>
                                                            <linearGradient id="colorPension" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stopColor="#10b981" stopOpacity={0.8} /><stop offset="95%" stopColor="#10b981" stopOpacity={0.2} /></linearGradient>
                                                            <linearGradient id="colorGeneral" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stopColor="#f59e0b" stopOpacity={0.8} /><stop offset="95%" stopColor="#f59e0b" stopOpacity={0.2} /></linearGradient>
                                                        </defs>
                                                        <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                                        <XAxis dataKey="age" tick={{ fontSize: 10, fill: '#94a3b8' }} tickLine={false} axisLine={false} />
                                                        <YAxis yAxisId="left" tickFormatter={formatAxisY} tick={{ fontSize: 10, fill: '#94a3b8' }} width={40} tickLine={false} axisLine={false} />
                                                        <YAxis yAxisId="right" orientation="right" tickFormatter={formatAxisY} tick={{ fontSize: 10, fill: '#94a3b8' }} width={40} tickLine={false} axisLine={false} />
                                                        <Tooltip content={<CustomChartTooltip />} />
                                                        <Legend wrapperStyle={{ fontSize: '11px', paddingTop: '10px' }} iconType="circle" iconSize={8} />

                                                        <ReferenceLine yAxisId="left" x={simResult.effAgeRetire} stroke="#94a3b8" strokeDasharray="3 3" label={{ value: '은퇴', position: 'insideTopLeft', fill: '#64748b', fontSize: 10 }} />

                                                        <Line yAxisId="right" name="필요 생활비" type="monotone" dataKey="expense" stroke="#ef4444" strokeWidth={2} strokeDasharray="3 3" dot={false} isAnimationActive={true} legendType="none" />
                                                        <Line yAxisId="left" name="총 자산" type="monotone" dataKey="balance" stroke="#475569" strokeWidth={2} dot={false} isAnimationActive={true} legendType="none" />

                                                        <Area yAxisId="right" name="국민연금" type="monotone" dataKey="nps" stackId="1" fill="url(#colorNps)" stroke="none" />
                                                        <Area yAxisId="right" name="주택연금" type="monotone" dataKey="housing" stackId="1" fill="url(#colorHousing)" stroke="none" />
                                                        <Area yAxisId="right" name="개인연금" type="monotone" dataKey="pension" stackId="1" fill="url(#colorPension)" stroke="none" />
                                                        <Area yAxisId="right" name="기타자산" type="monotone" dataKey="general" stackId="1" fill="url(#colorGeneral)" stroke="none" />
                                                    </ComposedChart>
                                                </ResponsiveContainer>
                                            </div>
                                        </div>

                                        <div className="p-4 flex flex-col h-auto min-h-[350px]">
                                            <div className="mb-2">
                                                <h3 className="font-bold text-sm text-slate-800 flex items-center gap-2">
                                                    <PiggyBank className="text-emerald-600" size={16} /> 은퇴 시점 자산 구성
                                                </h3>
                                            </div>
                                            <div className="flex-1 w-full relative h-[250px]">
                                                <ResponsiveContainer width="100%" height="100%">
                                                    <PieChart>
                                                        <Pie data={simResult.assetComposition} cx="50%" cy="50%" innerRadius={40} outerRadius={80} paddingAngle={5} dataKey="value">
                                                            {simResult.assetComposition.map((entry, index) => (
                                                                <Cell key={`cell-${index}`} fill={PIE_COLORS[index % PIE_COLORS.length]} />
                                                            ))}
                                                        </Pie>
                                                        <Tooltip formatter={(v) => formatMoney(v)} contentStyle={{ borderRadius: '8px', border: 'none', boxShadow: '0 4px 12px rgba(0,0,0,0.1)', fontSize: '11px' }} />
                                                        <Legend verticalAlign="bottom" height={36} iconType="circle" wrapperStyle={{ fontSize: '11px' }} />
                                                    </PieChart>
                                                </ResponsiveContainer>
                                                <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none pb-8">
                                                    <div className="text-[10px] text-slate-400">총 자산</div>
                                                    <div className="text-xs font-bold text-slate-800">{formatMoney(simResult.totalAssetsAtRetire / 100000000).replace('원', '')}억</div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Footer Guide */}
                                    <div className="bg-slate-50 rounded-xl p-4 border border-slate-200">
                                        <h4 className="text-xs font-bold text-slate-700 mb-3 flex items-center gap-1"><BookOpen size={14} /> 시뮬레이션 상세 가이드</h4>
                                        <div className="flex flex-col gap-2 text-xs text-slate-600">
                                            <div className="flex gap-2"><span className="font-bold text-slate-800 min-w-[60px]">📈 총자산</span><span>부동산을 제외한 모든 금융 자산의 합계로, 은퇴 생활비의 주된 재원입니다.</span></div>
                                            <div className="flex gap-2"><span className="font-bold text-slate-800 min-w-[60px]">🛡️ 개인연금</span><span>은퇴 시 수령할 예상 퇴직금(미래 임금상승률 2% 반영)이 포함되어 계산됩니다.</span></div>
                                            <div className="flex gap-2"><span className="font-bold text-slate-800 min-w-[60px]">💰 기타자산</span><span>예적금, 주식, ETF 등이 포함되며 설정한 자산 운용 전략에 따라 매년 복리로 늘어납니다.</span></div>
                                            <div className="flex gap-2"><span className="font-bold text-slate-800 min-w-[60px]">📉 국민연금</span><span>전체 가입자 평균소득(A값)과 본인 평균소득(B값)을 기반으로 소득대체율을 적용했습니다. (물가 연동)</span></div>
                                            <div className="flex gap-2"><span className="font-bold text-slate-800 min-w-[60px]">🏠 주택연금</span><span>가입 연령 및 주택 가격에 따른 차등 지급률(0.25% ~ 0.32%)이 적용되었습니다.</span></div>
                                            <div className="flex gap-2 text-rose-500"><span className="font-bold min-w-[60px]">⚠️ 주의</span><span>세금(이자소득세 등)과 건보료는 개인 상황에 따라 달라 반영되지 않았습니다.</span></div>
                                        </div>
                                    </div>
                                </div>
                            </>
                        ) : (
                            <div className="h-full flex flex-col items-center justify-center p-10 bg-slate-100 rounded-xl border border-dashed border-slate-300 text-slate-500">
                                <AlertTriangle size={40} className="mb-4 opacity-50 text-rose-400" />
                                <h3 className="text-base font-bold mb-2">입력 정보를 확인해주세요</h3>
                                <p className="text-xs">{simResult?.msg || "현재 나이가 은퇴 목표 나이보다 많습니다."}</p>
                            </div>
                        )}
                    </section>
                </div>
            );
        };
        const ServiceInfo = () => (
            <div className="mt-12 border-t border-slate-200 pt-8 pb-4">
                <div className="grid md:grid-cols-2 gap-8">
                    <div>
                        <h3 className="flex items-center gap-2 text-sm font-bold text-slate-800 mb-3">
                            <HelpCircle size={16} className="text-blue-500" />
                            어떤 서비스인가요?
                        </h3>
                        <p className="text-xs text-slate-500 leading-relaxed mb-4">
                            '뼈때리는 은퇴 계산기'는 막연한 노후 준비를 현실적인 데이터로 시각화해주는 <strong>은퇴 자금 계산기</strong>입니다. Ver 2.0 업데이트를 통해 실제 한국형 퇴직금 계산 방식과 국민연금 소득대체율 로직을 반영하여 정확도를 높였습니다.
                        </p>
                    </div>
                    <div>
                        <h3 className="flex items-center gap-2 text-sm font-bold text-slate-800 mb-3">
                            <Search size={16} className="text-emerald-500" />
                            활용 가이드
                        </h3>
                        <div className="bg-white p-3 rounded-lg border border-slate-100 shadow-sm text-xs text-slate-600 space-y-2">
                            <div className="flex gap-2">
                                <span className="font-bold text-blue-600 bg-blue-50 px-1.5 rounded">SAVE</span>
                                <span>입력한 데이터는 브라우저에 자동 저장되어 재방문 시 유지됩니다.</span>
                            </div>
                            <div className="flex gap-2">
                                <span className="font-bold text-rose-600 bg-rose-50 px-1.5 rounded">NEW</span>
                                <span>'랜덤 변동성 ON' 기능을 켜면 시장 하락장이 올 경우를 시뮬레이션할 수 있습니다.</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        );

        const App = () => {
            const handleShare = () => {
                const url = window.location.href;
                const textArea = document.createElement("textarea");
                textArea.value = url;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand("copy");
                document.body.removeChild(textArea);
                alert('URL이 복사되었습니다!');
            };

            return (
                <div className="min-h-screen bg-slate-50 flex flex-col font-sans text-sm relative">




                    <main className="ad-optimized-container flex-grow py-6 z-0">
                        <ErrorBoundary>
                            <RetirementCalculator />
                        </ErrorBoundary>
                        <ServiceInfo />
                    </main>

                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    </script>
</body>

</html>
